<script>
(function () {
  const tikzjaxScriptUrl = "https://tikzjax.com/v1/tikzjax.js";

  function loadTikzJax() {
    if (document.querySelector('script[src="' + tikzjaxScriptUrl + '"]')) {
      return;
    }

    const script = document.createElement("script");
    script.src = tikzjaxScriptUrl;
    document.head.appendChild(script);
  }

  function convertTikzCdBlocks() {
    const selectors = [
      "pre.tikzcd > code",
      "pre > code.language-tikzcd",
      "pre > code.tikzcd"
    ];

    for (const selector of selectors) {
      document.querySelectorAll(selector).forEach(function (code) {
        const pre = code.parentElement;
        if (!pre || pre.dataset.tikzjaxConverted === "true") {
          return;
        }

        pre.dataset.tikzjaxConverted = "true";

        const diagram = document.createElement("div");
        diagram.className = "tikzjax-diagram";

        const tikzScript = document.createElement("script");
        tikzScript.type = "text/tikz";
        tikzScript.text = code.textContent.trim();

        diagram.appendChild(tikzScript);
        pre.replaceWith(diagram);
      });
    }
  }

  function init() {
    convertTikzCdBlocks();
    loadTikzJax();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
