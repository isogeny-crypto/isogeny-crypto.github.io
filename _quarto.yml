project:
  type: website
  output-dir: docs
  pre-render: python3 scripts/fetch_contributors.py

date-modified: last-modified

website:
  title: "Isogeny-based Cryptography Wiki"
  description: "An accessible reference for isogeny-based protocols."
  search:
    location: sidebar
    type: overlay
    copy-button: true
  sidebar:
    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - section: "Key Exchange"
        contents: "protocols/key-exchange/*.qmd"
      - section: "Digital Signature"
        contents: "protocols/digital-signature/*.qmd"

format:
  html:
    filters:
      - scripts/tikz.lua
      - scripts/contributors.lua
    include-in-header:
      - templates/tikzjax-header.html
    theme:
      light: cosmo
      dark: cyborg
    css: 
      - /assets/fonts.css
      - /assets/protocol-list.css
    toc: true
    toc-location: right
    code-fold: true
    html-math-method: mathjax
    minimal: false
    number-sections: true
    csl: alpha.csl
    bibliography: references.bib