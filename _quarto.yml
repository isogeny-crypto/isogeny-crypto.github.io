project:
  type: website
  output-dir: docs # Points directly to GitHub Pages deployment folder
  pre-render: python3 fetch_contributors.py
  
date-modified: last-modified

filters:
  - tikz.lua

website:
  title: "Isogeny-based Cryptography Wiki"
  description: "An accessible reference for isogeny-based protocols."
  
  # Global search configuration
  search:
    location: sidebar
    type: overlay
    copy-button: true

  # Wiki-style sidebar navigation
  sidebar:
    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - section: "Key Exchange"
        contents: "protocols/key-exchange/*.qmd"
      - section: "Digital Signature"
        contents: "protocols/digital-signature/*.qmd"

resources:
  - tikzjax-assets/
  - sw.js

format:
  html:
    include-in-header:
      - tikzjax-header.html
    theme:
      light: cosmo
      dark: cyborg
    toc: true                  # Table of contents on the right side
    toc-location: right
    code-fold: true            # Keep implementation code tidy
    html-math-method: mathjax  # Excellent screen-reader support for LaTeX
    minimal: false             # Keep true responsive navbar, but rely on bootstrap styling
    number-sections: true
    csl: alpha.csl
    bibliography: references.bib